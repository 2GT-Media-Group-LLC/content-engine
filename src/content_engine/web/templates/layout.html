<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{{ brand }} Engine{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: {
    sans: ['Inter', 'ui-sans-serif', 'system-ui'],
    mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
  } } } }
</script>
<style>
  body { background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120,119,198,0.18), transparent),
    #0a0a0f; color: #e7e7ee; font-family: 'Inter', system-ui, sans-serif; }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
  .card:hover { border-color: rgba(168,162,247,0.35); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px;
          letter-spacing: 0.04em; text-transform: uppercase; }
  .pill-topic    { background: rgba(120,119,198,0.18); color: #c8c5ff; }
  .pill-risk     { background: rgba(255,120,120,0.15); color: #ffb3b3; }
  .pill-format   { background: rgba(120,255,180,0.12); color: #a8f0c8; }
  .pill-platform { background: rgba(255,200,120,0.12); color: #f0d8a8; }
  .pill-fate-pending  { background: rgba(255,255,255,0.08); color: #cccccc; }
  .pill-fate-produced { background: rgba(120,255,180,0.18); color: #a8f0c8; }
  .pill-fate-parked   { background: rgba(255,200,120,0.18); color: #f0d8a8; }
  .pill-fate-rejected { background: rgba(255,120,120,0.18); color: #ffb3b3; }
  .glow { box-shadow: 0 0 0 1px rgba(168,162,247,0.25), 0 0 30px rgba(120,119,198,0.15); }
  .btn { padding: 10px 18px; border-radius: 10px; font-weight: 500; transition: all 0.15s;
         border: 1px solid transparent; }
  .btn-primary  { background: linear-gradient(135deg,#7c6bff,#d96bff); color: white; }
  .btn-primary:hover  { transform: translateY(-1px); }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #e7e7ee; border-color: rgba(255,255,255,0.1); }
  .btn-secondary:hover { background: rgba(255,255,255,0.10); }
  .btn-produced { background: rgba(46,160,67,0.2); color: #a8f0c8; border-color: rgba(46,160,67,0.4); }
  .btn-produced:hover { background: rgba(46,160,67,0.32); }
  .btn-park     { background: rgba(245,158,11,0.18); color: #fed7aa; border-color: rgba(245,158,11,0.4); }
  .btn-park:hover     { background: rgba(245,158,11,0.28); }
  .btn-reject   { background: rgba(239,68,68,0.18); color: #fca5a5; border-color: rgba(239,68,68,0.4); }
  .btn-reject:hover   { background: rgba(239,68,68,0.28); }
  .grid-bg { background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px; }
  .meter { height: 6px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .meter > div { height: 100%; background: linear-gradient(90deg,#6b7cff,#d96bff); }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  a { color: inherit; text-decoration: none; }
  .link { color: #c8c5ff; }
  .link:hover { color: #e0deff; text-decoration: underline; }
</style>
</head>
<body class="antialiased">
<nav class="grid-bg border-b border-white/5">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <span class="text-xs tracking-[0.3em] text-white/40 uppercase">{{ brand }}</span>
      <span class="text-sm font-medium">Content Engine</span>
    </a>
    <div class="flex gap-5 text-sm text-white/60">
      <a href="/" class="hover:text-white/90">Dashboard</a>
      <a href="/performance" class="hover:text-white/90">Performance</a>
      <a href="/logs" class="hover:text-white/90">Logs</a>
      <a href="/settings" class="hover:text-white/90">Settings</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-10">
  {% block content %}{% endblock %}
</main>

<footer class="mt-16 mb-8 text-xs text-white/30 text-center">
  {{ brand }} Engine · <span class="font-mono">localhost</span>
</footer>
</body>
</html>
