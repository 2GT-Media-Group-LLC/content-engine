# channel.yaml — channel-specific configuration for the content engine.
#
# This is the *example* file checked into the repo. Copy it to channel.yaml
# (which is gitignored) and edit for your channel:
#
#   cp channel.example.yaml channel.yaml
#
# Defaults below are tuned for a homelab / self-hosting / AI / virtualization
# channel. Replace with your own niche.

brand:
  # Human-facing channel name. Used in prompts and report titles.
  name: "Your Channel Name"
  # Short token used as a brand tag. Often the channel acronym.
  short: "YOUR"
  # The niche topics your channel covers. Used by the idea synthesizer to
  # constrain suggestions. Order = priority.
  niche:
    - homelab
    - self-hosting
    - AI (local + cloud)
    - virtualization
    - infrastructure
    - networking

# Plain-English description of your audience. Fed into every idea/outline prompt.
audience_summary: |
  Mid-to-high technical viewers comfortable with Linux, containers,
  and virtualization. Not novices. Opinionated about AI and hypervisors.

# ─── Content mix (desired topic balance for the weekly brief) ─────────────
# AI topics move fast and score high "novelty", so without a thumb on the
# scale they can dominate the brief. These pillars bias cluster selection
# toward the balance you actually want.
#   pillars: relative weights (need not sum to 100). Higher = first dibs.
#            Pillar names match the engine's topic tags; "ai" covers both
#            ai-local and ai-cloud.
#   max_ai_per_cycle: hard cap on AI-centric ideas per brief (-1 = uncapped).
content_mix:
  pillars:
    homelab: 40
    virtualization: 25      # Proxmox, VMware, hypervisors
    networking: 15
    self-hosting: 15
    security: 10
    storage: 10
    hardware: 10
    ai: 15
  max_ai_per_cycle: 1

# Topics where your audience reliably has strong emotional reactions.
# The synthesizer adds matching items to each idea's risk_flags so the
# brief surfaces "this could be divisive" before you green-light it.
divisive_topics:
  - name: "AI (local or cloud)"
    note: "Audience splits between AI-slop critics and enthusiasts"
  - name: "Proxmox criticism"
    note: "Passionate base — even fair criticism can attract pile-ons"

# ─── YouTube (peers + own channel) ────────────────────────────────────────
# The engine pulls your own recent uploads + your peer channels via a
# pluggable provider, selected by the YOUTUBE_PROVIDER env var in .env:
#
#   vidiq    (default, recommended) — direct VidIQ MCP. Needs VIDIQ_API_KEY
#            and a paid VidIQ account. Unlocks `engine sync-performance`
#            (automatic 30-day analytics snapshot for the idea synthesizer).
#   composio (legacy / fallback)    — Composio YOUTUBE_LIST_CHANNEL_VIDEOS.
#            Needs COMPOSIO_API_KEY + Google OAuth on app.composio.dev.
#            Does NOT support analytics. NOT recommended post-2026 Composio
#            breach — see docs/SECURITY.md.
#   noop     — runs the rest of the pipeline without YouTube signal.
#
youtube:
  # Your channel ID (starts with UC). Find at:
  #   https://www.youtube.com/account_advanced
  own_channel_id: "UCXXXXXXXXXXXXXXXXXXXXXX"
  own_channel_title: "Your Channel Name"
  # Peer channels you want to watch as signal (NOT to copy — to know what
  # the niche is talking about). 3-5 is the sweet spot.
  peer_channels:
    - handle: "@LAWRENCESYSTEMS"
      name: "Lawrence Systems"
    - handle: "@CraftComputing"
      name: "Craft Computing"
    - handle: "@JeffGeerling"
      name: "Jeff Geerling"
    - handle: "@ServeTheHomeVideo"
      name: "ServeTheHome"

# ─── Reddit subreddits to monitor ─────────────────────────────────────────
# Public JSON API — no auth needed. Adjust limits to control volume vs. noise.
reddit:
  subreddits:
    - { name: homelab,        limit: 15 }
    - { name: selfhosted,     limit: 15 }
    - { name: LocalLLaMA,     limit: 15 }
    - { name: Proxmox,        limit: 15 }
    - { name: HomeNetworking, limit: 12 }
    - { name: sysadmin,       limit: 12 }
    - { name: DataHoarder,    limit: 12 }
    - { name: docker,         limit: 12 }

# ─── Comment mining (vidiq provider only) ─────────────────────────────────
# Mines top comment threads from your channel + peer channels for questions,
# requests, and pain points — ingested as signals so audience asks compete
# for heat directly against Reddit/HN trends. One provider call per channel
# per cycle (5 vidiq credits each).
comments:
  enabled: true
  per_channel: 30        # comment threads to scan per channel

# ─── Outlier scan (vidiq provider only) ───────────────────────────────────
# Finds breakout videos across the WHOLE niche — videos massively
# overperforming their channel's baseline — beyond your fixed peer list.
# One call per keyword per cycle (5 credits each). Defaults to your first
# three brand.niche topics if keywords is omitted.
outliers:
  enabled: true
  per_keyword: 8
  # keywords:            # override the niche-derived defaults
  #   - homelab
  #   - self-hosted
  #   - proxmox

# ─── Hacker News keyword search ───────────────────────────────────────────
# Each keyword becomes a separate Algolia query. Stories matching any keyword
# above min_points within window_days get ingested.
hackernews:
  queries:
    - proxmox
    - homelab
    - self-hosted
    - selfhost
    - tailscale
    - truenas
    - vmware
    - broadcom vmware
    - virtualization
    - kubernetes homelab
    - ollama
    - llama.cpp
    - local llm
    - local ai
    - wireguard
    - unifi
    - veeam
  min_points: 20
  window_days: 14
