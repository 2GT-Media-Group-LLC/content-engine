[project]
name = "content-engine"
version = "0.1.0"
description = "Content engine — multi-agent ideation + outline pipeline for technical YouTube channels."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "ollama>=0.4",
  "jinja2>=3.1",
  "lancedb>=0.13",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "rich>=13.7",
  "python-dateutil>=2.9",
  "tenacity>=8.2",
  "platformdirs>=4.2",
  "python-dotenv>=1.0",
  "composio_core>=0.7",
  "feedparser>=6.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
gui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
engine = "content_engine.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"content_engine" = ["prompts/*.txt", "reports/templates/*.j2", "reports/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
